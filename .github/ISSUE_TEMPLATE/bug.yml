name: Ошибка
description: Что-то работает не так
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что делали, что ожидали и что получилось
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: |
        1. Включить раскладку «Русская + Қазақша»
        2. …
  - type: input
    id: macos
    attributes:
      label: Версия macOS
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Мак и программа, где не работает
      placeholder: MacBook Air M3, Telegram
  - type: input
    id: version
    attributes:
      label: Версия YX_KazQwerty
      placeholder: "1.0"
  - type: textarea
    id: state
    attributes:
      label: Состояние движка
      description: |
        Выполните в Терминале `pkill -USR1 -f YX_KazQwerty.app/Contents/MacOS/YX_KazQwerty`
        и приложите `~/Library/Logs/YX_KazQwerty/state.txt`.
      render: text
